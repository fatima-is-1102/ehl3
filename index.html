<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Profile Card</title>
  <!-- Links the external CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <div class="avatar">🚀</div>
    <h1>Alex Rivera</h1>
    <p class="role">Frontend Developer & UI Designer</p>
    <p class="bio">
      Building clean, accessible web experiences with HTML, CSS, and modern JavaScript.
    </p>
    <div class="actions">
      <a href="#projects" class="btn primary">View Work</a>
      <a href="#contact" class="btn secondary">Contact</a>
    </div>
  </main>

</body>
</html>
